name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend & ML Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pyproject.toml
          pip install pytest pytest-asyncio httpx puremagic librosa soundfile torchvision timm opencv-python-headless

      - name: Export checkpoints for test suite
        run: |
          python -m ml.training.train_visual
          python -m ml.training.train_audio

      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      - name: Run Pytest test suite
        run: |
          python -m pytest tests/

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --no-audit

      - name: Build frontend bundle
        working-directory: ./frontend
        run: npm run build
